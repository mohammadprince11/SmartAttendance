name: CI

# يعمل على كل PR لـmain وكل دفع لـmain وعند الطلب اليدوي.
# ملاحظة أمان: هذا الوركفلو لا ينشر شيئاً إطلاقاً — النشر إجراء يدوي بموافقة صريحة.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK information
        shell: pwsh
        run: dotnet --info

      - name: Restore
        shell: pwsh
        run: dotnet restore SmartAttendance.slnx

      - name: Build (Release)
        shell: pwsh
        run: dotnet build SmartAttendance.slnx -c Release --no-restore

      # الاختبارات تُشغَّل بمسار المشروع صراحةً — لا اعتماد على شمول الحل،
      # فلا يمكن أن يمر البناء «أخضر» بلا تشغيل اختبار واحد (العيب السابق).
      - name: Unit tests
        shell: pwsh
        run: >
          dotnet test SmartAttendance.Tests/SmartAttendance.Tests.csproj
          -c Release
          --no-build
          --filter "FullyQualifiedName!~ProductionClosureSqlTests&FullyQualifiedName!~AccessRoleServiceIntegrationTests&FullyQualifiedName!~ThemeStoreIntegrationTests&FullyQualifiedName!~CrossCompanyResourceDenialTests&FullyQualifiedName!~SecurityAuditLogTests&FullyQualifiedName!~TenantIsolationIntegrationTests"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory ${{ github.workspace }}/TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: ${{ github.workspace }}/TestResults/**
          if-no-files-found: warn
          retention-days: 14

  sql-acceptance:
    name: SQL Server Acceptance
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ZYNORA_E2E_DATABASE_NAME: SmartAttendance_E2E_SQL_${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate patch whitespace
        shell: pwsh
        run: git diff --check origin/main...HEAD

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore SmartAttendance.slnx

      - name: Build tests (Release)
        shell: pwsh
        run: dotnet build SmartAttendance.Tests/SmartAttendance.Tests.csproj -c Release --no-restore

      - name: Start disposable SQL Server LocalDB
        shell: pwsh
        run: sqllocaldb start MSSQLLocalDB

      - name: Create disposable integration database
        shell: pwsh
        run: |
          $password = [Guid]::NewGuid().ToString('N') + 'Aa1!'
          $connection = "Server=(localdb)\MSSQLLocalDB;Database=$env:ZYNORA_E2E_DATABASE_NAME;Integrated Security=true;TrustServerCertificate=true;MultipleActiveResultSets=true"
          $env:ZYNORA_BOOTSTRAP_ADMIN_PASSWORD = $password
          "SMARTATTENDANCE_INTEGRATION_TEST_CONNECTION=$connection" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          dotnet run --project tools/SmartAttendance.E2E.Bootstrap -c Release -- setup

      - name: Tenant isolation and sequence invariants
        shell: pwsh
        run: >
          dotnet test SmartAttendance.Tests/SmartAttendance.Tests.csproj
          -c Release
          --no-build
          --filter "FullyQualifiedName~ProductionClosureSqlTests"
          --logger "trx;LogFileName=sql-acceptance.trx"
          --results-directory ${{ github.workspace }}/SqlAcceptanceResults

      - name: Legacy integration invariants on disposable SQL
        shell: pwsh
        run: >
          dotnet test SmartAttendance.Tests/SmartAttendance.Tests.csproj
          -c Release
          --no-build
          --filter "FullyQualifiedName~AccessRoleServiceIntegrationTests|FullyQualifiedName~ThemeStoreIntegrationTests|FullyQualifiedName~CrossCompanyResourceDenialTests|FullyQualifiedName~SecurityAuditLogTests|FullyQualifiedName~TenantIsolationIntegrationTests"
          --logger "trx;LogFileName=sql-integration.trx"
          --results-directory ${{ github.workspace }}/SqlAcceptanceResults

      - name: Remove disposable integration database
        if: always()
        shell: pwsh
        run: dotnet run --project tools/SmartAttendance.E2E.Bootstrap -c Release --no-build -- teardown

      - name: Upload SQL acceptance results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sql-acceptance-results
          path: ${{ github.workspace }}/SqlAcceptanceResults/**
          if-no-files-found: warn
          retention-days: 14

  security-audit:
    name: NuGet Vulnerability Audit
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore SmartAttendance.slnx

      # يفشل الوركفلو عند وجود حزمة مصابة — الخرج يُرفع كأثر للمراجعة.
      - name: Audit vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list SmartAttendance.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          $out | Tee-Object -FilePath vulnerable-packages.txt
          if ($out -match 'has the following vulnerable packages') {
            Write-Error 'حزم NuGet مصابة — راجع vulnerable-packages.txt'
            exit 1
          }
          Write-Host 'لا حزم مصابة.'

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nuget-audit
          path: vulnerable-packages.txt
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Playwright E2E
    runs-on: windows-latest
    timeout-minutes: 40
    needs: build-and-test
    env:
      ZYNORA_E2E_BASE_URL: http://127.0.0.1:5086
      ZYNORA_E2E_USERNAME: admin
      ZYNORA_E2E_DATABASE_NAME: SmartAttendance_E2E_${{ github.run_id }}_${{ github.run_attempt }}
      ASPNETCORE_ENVIRONMENT: Development

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Create disposable E2E identity and database
        shell: pwsh
        run: |
          $password = [Guid]::NewGuid().ToString('N') + 'Aa1!'
          $connection = "Server=(localdb)\MSSQLLocalDB;Database=$env:ZYNORA_E2E_DATABASE_NAME;Integrated Security=true;TrustServerCertificate=true;MultipleActiveResultSets=true"
          "ZYNORA_E2E_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ZYNORA_BOOTSTRAP_ADMIN_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ConnectionStrings__DefaultConnection=$connection" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $env:ZYNORA_BOOTSTRAP_ADMIN_PASSWORD = $password
          dotnet run --project tools/SmartAttendance.E2E.Bootstrap -c Release -- setup

      - name: Build E2E
        shell: pwsh
        run: dotnet build SmartAttendance.E2E/SmartAttendance.E2E.csproj -c Release

      - name: Install Playwright browsers
        shell: pwsh
        run: |
          $ps1 = Get-ChildItem -Recurse -Filter playwright.ps1 `
            -Path SmartAttendance.E2E/bin/Release | Select-Object -First 1
          if (-not $ps1) { Write-Error 'playwright.ps1 غير موجود — تحقق من حزمة Microsoft.Playwright.'; exit 1 }
          & $ps1.FullName install --with-deps chromium

      - name: Start disposable ZYNORA web host
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'zynora-e2e-web.stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'zynora-e2e-web.stderr.log'
          $arguments = @(
            'run', '--project', 'SmartAttendance.Web/SmartAttendance.Web.csproj',
            '-c', 'Release', '--no-build', '--no-launch-profile',
            '--urls', $env:ZYNORA_E2E_BASE_URL
          )
          $process = Start-Process dotnet -ArgumentList $arguments -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "ZYNORA_E2E_WEB_PID=$($process.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $ready = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            if ($process.HasExited) { break }
            try {
              $response = Invoke-WebRequest "$env:ZYNORA_E2E_BASE_URL/Account/Login" -UseBasicParsing -TimeoutSec 2
              if ($response.StatusCode -eq 200) { $ready = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ready) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Disposable ZYNORA web host did not become ready.'
          }

      - name: Run E2E
        shell: pwsh
        run: >
          dotnet test SmartAttendance.E2E/SmartAttendance.E2E.csproj
          -c Release
          --no-build
          --logger "trx;LogFileName=e2e-tests.trx"
          --results-directory ${{ github.workspace }}/E2EResults

      - name: Stop host and remove disposable database
        if: always()
        shell: pwsh
        run: |
          if ($env:ZYNORA_E2E_WEB_PID) {
            Stop-Process -Id ([int]$env:ZYNORA_E2E_WEB_PID) -Force -ErrorAction SilentlyContinue
          }
          dotnet run --project tools/SmartAttendance.E2E.Bootstrap -c Release --no-build -- teardown

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: ${{ github.workspace }}/E2EResults/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload E2E host logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-host-logs
          path: ${{ runner.temp }}/zynora-e2e-web.*.log
          if-no-files-found: warn
          retention-days: 14
